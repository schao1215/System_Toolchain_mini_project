[project]
name = "miniproject"
version = "0.1.0"
description = "Tennessee Eastman fault detectors trained on normal data only"
readme = "README.md"
authors = [
    { name = "Sean", email = "schao1215@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
miniproject = "miniproject:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
